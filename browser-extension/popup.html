<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Shadow AI Defense Agent</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      box-sizing: border-box;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 12px;
      margin-bottom: 14px;
    }
    .shield-icon {
      width: 28px;
      height: 28px;
      background: #3b82f6;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }
    .title {
      font-size: 14px;
      font-weight: 700;
      color: #38bdf8;
    }
    .subtitle {
      font-size: 11px;
      color: #94a3b8;
    }
    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #1e293b;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 11px;
      margin-bottom: 14px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
    }
    .dot.offline {
      background: #ef4444;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }
    .stat-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 10px;
      text-align: center;
    }
    .stat-num {
      font-size: 20px;
      font-weight: 700;
      color: #f1f5f9;
    }
    .stat-num.leak {
      color: #ef4444;
    }
    .stat-lbl {
      font-size: 10px;
      color: #94a3b8;
      margin-top: 2px;
      text-transform: uppercase;
    }
    .btn {
      display: block;
      width: 100%;
      box-sizing: border-box;
      background: #2563eb;
      color: white;
      text-align: center;
      padding: 8px 0;
      border-radius: 6px;
      text-decoration: none;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="shield-icon">🛡️</div>
    <div>
      <div class="title">Shadow AI Defense</div>
      <div class="subtitle">Endpoint Telemetry Agent v1.0</div>
    </div>
  </div>

  <div class="status-badge">
    <div class="dot" id="status-dot"></div>
    <span id="status-text">SOC Gateway Connected</span>
  </div>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-num" id="stat-scanned">0</div>
      <div class="stat-lbl">Prompts Scanned</div>
    </div>
    <div class="stat-card">
      <div class="stat-num leak" id="stat-leaks">0</div>
      <div class="stat-lbl">Leakages Flagged</div>
    </div>
  </div>

  <button class="btn" id="open-soc-btn">Launch SOC Dashboard</button>

  <script src="popup.js"></script>
</body>
</html>
